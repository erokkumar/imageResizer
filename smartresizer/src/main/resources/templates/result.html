<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resize Successful | Smart Resizer</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #00b09b;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            padding-top: 100px !important; /* Added for Navbar space */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Navbar */
        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            padding: 2px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            margin-left: 20px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #00d2ff !important;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* Glass Container */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            animation: floatUp 0.8s ease-out;
            margin-bottom: 30px;
            margin-top: auto;
            position: relative; /* Z-index fix */
            z-index: 1;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success Icon */
        .success-icon {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 176, 155, 0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* Result Image */
        .result-img-wrapper {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Custom Table */
        .glass-table {
            width: 100%;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
        }

        .glass-table th {
            background: rgba(255,255,255,0.1);
            color: #ddd;
            font-weight: 600;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.85rem;
            border: none;
        }

        .glass-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        /* Buttons */
        .btn-download {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
            position: relative;
            overflow: hidden;
        }

        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6); color: white; }

        /* Ripple Effect */
        .btn-download:active::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            animation: ripple 0.3s linear;
        }
        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .btn-retry {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            margin-left: 15px;
        }
        .btn-retry:hover { background: white; color: #333; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(56, 239, 125, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
        }

        .badge-diff { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px; font-size: 0.9em; }
        .new-val { color: #38ef7d; font-weight: bold; }

        /* Footer */
        footer {
            margin-top: auto;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
        }

        .footer-logo {
            height: 35px;
            width: 35px;
            object-fit: contain;
            border-radius: 50%;
            background-color: white;
            padding: 2px;
        }

        /* Floating shapes */
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; }
        .shape-1 { top: -100px; left: -100px; width: 300px; height: 300px; background: #764ba2; opacity: 0.6; }
        .shape-2 { bottom: -100px; right: -100px; width: 400px; height: 400px; background: #ff00cc; opacity: 0.4; }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg glass-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/images/logo.png}"
                 onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3588/3588656.png';"
                 class="nav-logo me-2">
            <span style="color: white; font-weight: 700; letter-spacing: 1px;">Smart Resizer</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                <li class="nav-item">
                    <a class="btn btn-sm btn-light rounded-pill ms-3 px-3" href="#" style="color: #667eea; font-weight:bold;">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="shape shape-1"></div>
<div class="shape shape-2"></div>

<div class="glass-card">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>

    <h2>Image Resized Successfully!</h2>
    <p style="color: rgba(255,255,255,0.7)">Your optimized image is ready for download.</p>

    <div class="result-img-wrapper">
        <img th:src="@{'/download?filename=' + ${info.resizedFileName}}" class="result-img" alt="Resized Image">
    </div>

    <div class="glass-table">
        <table style="width:100%">
            <thead>
            <tr>
                <th>Property</th>
                <th>Original</th>
                <th>Result</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td><i class="far fa-file-image me-2"></i> File Name</td>
                <td th:text="${info.fileName}" style="opacity: 0.7;"></td>
                <td th:text="${info.resizedFileName}" style="font-weight:bold;"></td>
            </tr>
            <tr>
                <td><i class="fas fa-ruler-combined me-2"></i> Dimensions</td>
                <td>
                        <span class="badge-diff">
                            <span th:text="${info.originalWidth}"></span> x <span th:text="${info.originalHeight}"></span>
                        </span>
                </td>
                <td>
                        <span class="badge-diff new-val">
                            <span th:text="${info.newWidth}"></span> x <span th:text="${info.newHeight}"></span>
                        </span>
                </td>
            </tr>
            <tr>
                <td><i class="fas fa-weight-hanging me-2"></i> File Size</td>
                <td style="opacity: 0.7;">
                    <span th:text="${info.originalSizeKB}"></span> KB
                </td>
                <td class="new-val">
                    <span th:text="${info.newSizeKB}"></span> KB
                    <i class="fas fa-level-down-alt ms-1"></i>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4 d-flex justify-content-center align-items-center">
        <a th:href="@{'/download?filename=' + ${info.resizedFileName}}" download class="btn-download">
            <i class="fas fa-download"></i> Download Image
        </a>

        <a href="/" class="btn-retry">
            <i class="fas fa-redo"></i> Resize Another
        </a>
    </div>
</div>

<footer>
    <img th:src="@{/images/logo.png}" alt="Logo" class="footer-logo"
         onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3588/3588656.png';">

    <span>Copyright &copy; 2025 by <strong>Rohit</strong></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
